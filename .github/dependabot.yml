version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: 0 0 * * *

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: 0 0 * * *
    groups:
      commitlint:
        patterns:
          - "@commitlint/*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: cron
      cronjob: 0 0 * * *

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: cron
      cronjob: 0 0 * * *

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: cron
      cronjob: 0 0 * * *
