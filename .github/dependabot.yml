version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: 0 9 * * *
      timezone: Asia/Tokyo

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: 0 9 * * *
      timezone: Asia/Tokyo
    groups:
      commitlint:
        patterns:
          - "@commitlint/*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: cron
      cronjob: 0 9 * * *
      timezone: Asia/Tokyo

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: cron
      cronjob: 0 9 * * *
      timezone: Asia/Tokyo

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: cron
      cronjob: 0 9 * * *
      timezone: Asia/Tokyo
