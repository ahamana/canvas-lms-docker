name: Delete Action Cache

on:
  workflow_dispatch:
  pull_request_target:
    types: closed

jobs:
  delete-cache:
    name: Delete Cache
    runs-on: ubuntu-slim
    permissions:
      actions: write

    steps:
      - name: Delete action cache
        uses: toshimaru/delete-action-cache@ab45c03c4f82162f880096a984a1fe1e7775a292 # v1.0.1
        with:
          limit: 2147483647
