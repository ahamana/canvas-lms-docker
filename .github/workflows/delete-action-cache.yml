name: Delete Action Cache

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  delete-cache:
    name: Delete Cache
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write

    steps:
      - name: Delete action cache
        uses: toshimaru/delete-action-cache@v1.0.1
        with:
          limit: 2147483647
