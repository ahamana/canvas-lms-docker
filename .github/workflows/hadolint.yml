name: Hadolint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &paths
      - Dockerfile.*
  pull_request:
    paths: *paths

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        os:
          - alpine
          - debian

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile.${{ matrix.os }}
          no-fail: true
