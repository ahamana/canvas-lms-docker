name: Docker

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ${{ github.repository_owner }}/canvas-lms

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        os:
          - alpine
          - debian
        ruby-version:
          - "3.4"
          - "4.0"
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
        exclude:
          # code_ownership 2.1.1 (pinned by canvas-lms) publishes no
          # aarch64-linux-musl gem, and this image does not build its Rust
          # extension from source, so ARM64 Alpine is unsupported.
          # 2.1.3+ publishes aarch64-linux-musl, so once canvas-lms bumps
          # Gemfile.lock to code_ownership >= 2.1.3 this exclude can be removed.
          # Use the Debian image for ARM64 until then.
          - os: alpine
            platform: linux/arm64

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - &login-dockerhub
        name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: ruby${{ matrix.ruby-version }}-${{ matrix.os }}

      - name: Build and push by digest
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          file: Dockerfile.${{ matrix.os }}
          build-args: |
            RUBY_VERSION=${{ matrix.ruby-version }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.meta.outputs.version }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ steps.meta.outputs.version }}-${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest=${{ steps.build-and-push.outputs.digest }}
          touch ${{ runner.temp }}/digests/${digest#sha256:}

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ steps.meta.outputs.version }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Write matrix outputs
        uses: cloudposse/github-action-matrix-outputs-write@ed06cf3a6bf23b8dce36d1cf0d63123885bb8375 # 1.0.0
        with:
          matrix-step-name: ${{ github.job }}
          matrix-key: ${{ steps.meta.outputs.version }}
          outputs: |
            image-version: ${{ steps.meta.outputs.version }}
            platform: ${{ matrix.platform }}

  read-matrix:
    name: Read Matrix
    runs-on: ubuntu-latest
    needs: build
    outputs:
      result: ${{ steps.read-matrix.outputs.result }}

    steps:
      - name: Read matrix outputs
        id: read-matrix
        uses: cloudposse/github-action-matrix-outputs-read@33cac12fa9282a7230a418d859b93fdbc4f27b5a # 1.0.0
        with:
          matrix-step-name: build

  merge:
    name: Merge
    runs-on: ubuntu-latest
    needs: read-matrix
    strategy:
      matrix:
        image-version: ${{ fromJson(needs.read-matrix.outputs.result).image-version.* }}

    steps:
      - *login-dockerhub

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: ${{ matrix.image-version }}

      - name: Download digests
        id: download-digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ steps.meta.outputs.version }}*
          merge-multiple: true

      - name: Create manifest list and push
        working-directory: ${{ steps.download-digests.outputs.download-path }}
        run: >-
          docker buildx imagetools create
          $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
