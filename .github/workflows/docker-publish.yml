name: Docker

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

env:
  REGISTRY_IMAGE: ${{ github.repository_owner }}/canvas-lms

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        os: &os
          - alpine
          - debian
        ruby-version: &ruby-version
          - "3.4"
          - "4.0"
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
        exclude:
          # code_ownership 2.1.1 (pinned by canvas-lms) publishes no
          # aarch64-linux-musl gem, and this image does not build its Rust
          # extension from source, so ARM64 Alpine is unsupported.
          # 2.1.3+ publishes aarch64-linux-musl, so once canvas-lms bumps
          # Gemfile.lock to code_ownership >= 2.1.3 this exclude can be removed.
          # Use the Debian image for ARM64 until then.
          - os: alpine
            platform: linux/arm64

    steps:
      - name: Prepare
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          cache-binary: false

      - &docker-login
        name: Login to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - &docker-metadata
        name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: ruby${{ matrix.ruby-version }}-${{ matrix.os }}

      - name: Build and push by digest # jactionlint ignore=cache-poisoning
        id: build-push
        uses: docker/build-push-action@v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          file: Dockerfile.${{ matrix.os }}
          build-args: |
            RUBY_VERSION=${{ matrix.ruby-version }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.meta.outputs.version }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ steps.meta.outputs.version }}-${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-${{ steps.meta.outputs.version }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    needs:
      - build
    strategy:
      matrix:
        os: *os
        ruby-version: *ruby-version

    steps:
      - *docker-login

      - *docker-metadata

      - name: Download digests
        id: download-digests
        uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ steps.meta.outputs.version }}*
          merge-multiple: true

      - name: Create manifest list and push
        shell: bash
        working-directory: ${{ steps.download-digests.outputs.download-path }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)
