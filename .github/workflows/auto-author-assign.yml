name: Auto Author Assign

on:
  pull_request_target:
    types:
      - opened
      - reopened

jobs:
  assign-author:
    name: Assign Author
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write

    steps:
      - name: Assign author
        uses: toshimaru/auto-author-assign@a78a94b219445cece8ccf0d45fec60af449f212a # v3.1.0
