name: Auto Author Assign

on:
  pull_request:
    types:
      - opened
      - reopened

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assign-author:
    name: Assign Author
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      pull-requests: write

    steps:
      - name: Assign author
        uses: toshimaru/auto-author-assign@v3.1.1
