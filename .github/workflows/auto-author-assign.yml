name: Auto Author Assign

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - reopened

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assign-author:
    name: Assign Author
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      pull-requests: write

    steps:
      - name: Assign author
        uses: toshimaru/auto-author-assign@415448809ea5ba0e171b251632720b009df3d8d6 # v3.1.1
