name: GitHub Actions Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &paths
      - .github/**
  pull_request:
    paths: *paths

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jactionlint:
    name: jactionlint
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run jactionlint
        uses: jdx/jactionlint@v2.4.0

  ghalint:
    name: ghalint
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - *checkout

      - name: Set up ghalint
        uses: jdx/mise-action@v5.2.6
        with:
          install_args: ghalint
          add_shims_to_path: false

      - name: Run ghalint
        shell: bash
        env:
          GHALINT_LOG_COLOR: always
        run: ghalint run

  zizmor:
    name: zizmor
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - *checkout

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          persona: auditor
          advanced-security: false
          annotations: true
