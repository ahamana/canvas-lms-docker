name: GitHub Actions Lint

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/**

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  ghalint:
    name: ghalint
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - *checkout

      - name: Set up ghalint
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: ghalint

      - name: Run ghalint
        run: ghalint run

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - *checkout

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
