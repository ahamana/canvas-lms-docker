name: GitHub Actions Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &paths
      - .github/workflows/**
  pull_request:
    paths: *paths

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  ghalint:
    name: ghalint
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - *checkout

      - name: Set up ghalint
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: ghalint
          add_shims_to_path: false

      - name: Run ghalint
        env:
          GHALINT_LOG_COLOR: always
        run: ghalint run

  zizmor:
    name: zizmor
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - *checkout

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true
