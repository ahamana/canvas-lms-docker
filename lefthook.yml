rc: ./.lefthookrc

pre-commit:
  jobs:
    - name: oxfmt
      run: pnx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: tombi
      glob: "*.toml"
      run: tombi format {staged_files}
      stage_fixed: true
